<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קריוקי — מסך ראשי</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Waiting screen ─────────────────────────────────────── */
    #waiting-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a1a 0%, #16213e 55%, #0f3460 100%);
      gap: 2rem;
    }

    .app-title {
      font-size: 3.5rem;
      font-weight: 800;
      color: #e94560;
      text-shadow: 0 0 40px rgba(233,69,96,0.5);
    }

    .room-box {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 2rem 4rem;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .room-label {
      font-size: 1rem;
      opacity: 0.6;
      margin-bottom: 0.4rem;
      letter-spacing: 0.08rem;
    }

    .room-code {
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: 0.5rem;
      color: #e94560;
      text-shadow: 0 0 25px rgba(233,69,96,0.7);
      line-height: 1;
    }

    .join-hint {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      opacity: 0.45;
    }

    .join-url {
      font-size: 1rem;
      opacity: 0.65;
      margin-top: 0.3rem;
      color: #a8d8ff;
    }

    .participants-section {
      text-align: center;
    }

    .participants-label {
      font-size: 0.85rem;
      opacity: 0.45;
      margin-bottom: 0.6rem;
    }

    .participants-chips {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 700px;
    }

    .chip {
      background: rgba(233,69,96,0.18);
      border: 1px solid rgba(233,69,96,0.35);
      border-radius: 50px;
      padding: 0.35rem 1.1rem;
      font-size: 1rem;
    }

    /* ── Player screen ──────────────────────────────────────── */
    #player-screen {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #yt-player-wrap {
      width: 100%;
      height: 100%;
    }

    #yt-player-wrap iframe {
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.88));
      padding: 3rem 2.5rem 1.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    .now-info { flex: 1; }

    .now-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12rem;
      opacity: 0.55;
      margin-bottom: 0.3rem;
    }

    .now-singer {
      font-size: 2rem;
      font-weight: 800;
      color: #e94560;
      line-height: 1.1;
    }

    .now-title {
      font-size: 0.95rem;
      opacity: 0.65;
      margin-top: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 600px;
    }

    .next-info {
      text-align: left;
      flex-shrink: 0;
    }

    .next-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1rem;
      opacity: 0.45;
      margin-bottom: 0.2rem;
    }

    .next-singer {
      font-size: 1.1rem;
      opacity: 0.75;
    }

    #skip-btn {
      padding: 0.5rem 1.2rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
      align-self: center;
    }

    #skip-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── Idle screen (queue empty, room active) ─────────────── */
    #idle-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a1a 0%, #16213e 55%, #0f3460 100%);
      gap: 1rem;
    }

    .idle-icon { font-size: 4rem; opacity: 0.4; }
    .idle-text { font-size: 1.8rem; opacity: 0.4; }
    .idle-code { font-size: 0.9rem; opacity: 0.3; margin-top: 0.5rem; }

    /* ── Error banner ───────────────────────────────────────── */
    #error-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #c0392b;
      color: #fff;
      padding: 0.7rem 1.5rem;
      font-size: 0.9rem;
      text-align: center;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Waiting for participants -->
  <div id="waiting-screen">
    <div class="app-title">🎤 קריוקי משפחתי</div>

    <div class="room-box">
      <div class="room-label">קוד החדר</div>
      <div class="room-code" id="room-code-display">----</div>
      <div class="join-hint">היכנסו לאתר בנייד ←</div>
      <div class="join-url" id="join-url"></div>
    </div>

    <div class="participants-section">
      <div class="participants-label">משתתפים מחוברים</div>
      <div class="participants-chips" id="participants-chips">
        <span style="opacity:0.3;font-size:0.9rem">עדיין אין משתתפים...</span>
      </div>
    </div>
  </div>

  <!-- Video player -->
  <div id="player-screen">
    <div id="yt-player-wrap">
      <div id="youtube-player"></div>
    </div>
    <div id="overlay">
      <div class="now-info">
        <div class="now-label">שר עכשיו</div>
        <div class="now-singer" id="now-singer">---</div>
        <div class="now-title" id="now-title">---</div>
      </div>
      <div id="next-info-block" class="next-info" style="display:none">
        <div class="next-label">הבא בתור</div>
        <div class="next-singer" id="next-singer-name">---</div>
      </div>
      <button id="skip-btn">⏭ דלג</button>
    </div>
  </div>

  <!-- Idle: room active, queue empty -->
  <div id="idle-screen">
    <div class="idle-icon">🎵</div>
    <div class="idle-text">ממתין לשיר הבא...</div>
    <div class="idle-code" id="idle-code"></div>
  </div>

  <div id="error-banner"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let roomId = null;
    let ytPlayer = null;
    let playerReady = false;
    let pendingVideoId = null;
    let hasHadSongs = false;

    /* ── YouTube IFrame API ─────────────────────────────────── */
    const ytScript = document.createElement('script');
    ytScript.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(ytScript);

    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          autoplay: 1,
          controls: 1,
          disablekb: 0,
          fs: 1,
          modestbranding: 1,
          rel: 0,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            playerReady = true;
            if (pendingVideoId) {
              ytPlayer.loadVideoById(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) {
              socket.emit('song-ended', { roomId });
            }
          },
          onError: () => {
            socket.emit('song-ended', { roomId });
          }
        }
      });
    };

    /* ── Room creation ──────────────────────────────────────── */
    socket.emit('create-room', (res) => {
      if (res.success) {
        roomId = res.roomId;
        document.getElementById('room-code-display').textContent = roomId;
        document.getElementById('join-url').textContent =
          `${window.location.origin}/remote`;
        document.getElementById('idle-code').textContent = 'קוד חדר: ' + roomId;
      }
    });

    /* ── Skip button ────────────────────────────────────────── */
    document.getElementById('skip-btn').addEventListener('click', () => {
      socket.emit('skip-song', { roomId });
    });

    /* ── Socket events ──────────────────────────────────────── */
    socket.on('play-song', (song) => {
      hasHadSongs = true;
      showScreen('player');
      if (playerReady && ytPlayer) {
        ytPlayer.loadVideoById(song.videoId);
      } else {
        pendingVideoId = song.videoId;
      }
    });

    socket.on('room-updated', (room) => {
      updateParticipants(room.participants || []);

      if (room.currentlyPlaying) {
        document.getElementById('now-singer').textContent = room.currentlyPlaying.singerName;
        document.getElementById('now-title').textContent = room.currentlyPlaying.title;

        if (room.queue.length > 0) {
          document.getElementById('next-singer-name').textContent = room.queue[0].singerName;
          document.getElementById('next-info-block').style.display = 'block';
        } else {
          document.getElementById('next-info-block').style.display = 'none';
        }
      } else if (!room.currentlyPlaying && room.queue.length === 0 && hasHadSongs) {
        showScreen('idle');
      }
    });

    /* ── Helpers ────────────────────────────────────────────── */
    function showScreen(name) {
      document.getElementById('waiting-screen').style.display = 'none';
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('idle-screen').style.display = 'none';

      if (name === 'player') {
        document.getElementById('player-screen').style.display = 'block';
      } else if (name === 'idle') {
        document.getElementById('idle-screen').style.display = 'flex';
      } else {
        document.getElementById('waiting-screen').style.display = 'flex';
      }
    }

    function updateParticipants(participants) {
      const el = document.getElementById('participants-chips');
      if (participants.length === 0) {
        el.innerHTML = '<span style="opacity:0.3;font-size:0.9rem">עדיין אין משתתפים...</span>';
      } else {
        el.innerHTML = participants.map(p => `<div class="chip">${esc(p.name)}</div>`).join('');
      }
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
