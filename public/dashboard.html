<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Subscriptions Dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <span class="logo-icon">⚡</span>
      <div class="header-title">
        <h1>AI Dashboard</h1>
        <span class="header-sub">Subscriptions & Live Usage</span>
      </div>
    </div>
    <div class="header-right">
      <div class="refresh-info">
        <span class="refresh-dot" id="refreshDot"></span>
        <span class="refresh-label" id="refreshLabel">Loading...</span>
      </div>
      <button class="btn-icon" id="btnRefresh" title="Force refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="summary-strip" id="summaryStrip">
    <div class="summary-card">
      <span class="summary-label">Monthly Total</span>
      <span class="summary-value accent" id="sumTotal">—</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">Flat Subscriptions</span>
      <span class="summary-value" id="sumSubCost">—</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">API Spend MTD</span>
      <span class="summary-value" id="sumApiSpend">—</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">Active Plans</span>
      <span class="summary-value" id="sumActive">—</span>
    </div>
  </div>

  <div class="controls-bar">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="ai-chat">AI Chat</button>
      <button class="filter-tab" data-filter="ai-api">APIs</button>
      <button class="filter-tab" data-filter="ai-image">Image</button>
      <button class="filter-tab" data-filter="other">Other</button>
    </div>
    <button class="btn-add" id="btnAdd">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add
    </button>
  </div>

  <main class="cards-grid" id="cardsGrid">
    <div class="loading-state">
      <div class="spinner"></div>
      <span>Loading subscriptions…</span>
    </div>
  </main>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Subscription</h2>
        <button class="btn-icon modal-close" id="modalClose">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form class="modal-body" id="modalForm"></form>
      <div class="modal-footer">
        <button class="btn-danger hidden" id="modalDelete">Delete</button>
        <div class="modal-footer-right">
          <button class="btn-ghost" id="modalCancel">Cancel</button>
          <button class="btn-primary" id="modalSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
